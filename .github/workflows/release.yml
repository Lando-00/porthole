name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the plugin
        run: node tests/validate.mjs

      # A tag that disagrees with the manifests would publish a release nobody
      # can reproduce, so refuse rather than guess.
      - name: Check the tag matches plugin.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./plugin.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $MANIFEST" >&2
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_ENV"
          echo "companion=$(node -p "require('./vscode-extension/package.json').version")" >> "$GITHUB_ENV"

      - name: Package the companion extension
        working-directory: vscode-extension
        run: npm run package

      - name: Name the VSIX after its version
        run: mv vscode-extension/porthole-companion.vsix "porthole-companion-${COMPANION}.vsix"
        env:
          COMPANION: ${{ env.companion }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: porthole-companion-${{ env.companion }}.vsix
          generate_release_notes: true
          body: |
            ## Install

            ```shell
            copilot plugin marketplace add Lando-00/porthole
            copilot plugin install porthole@porthole-marketplace
            ```

            Then the companion VS Code extension, which the annotations,
            walkthroughs, Problems-panel access, saved reviews, symbol lookup,
            sidebar and "Send to Copilot" all depend on:

            ```shell
            code-insiders --install-extension Lando-00.porthole-companion
            ```

            Or from the asset below, if you would rather not use the
            Marketplace:

            ```shell
            code-insiders --install-extension porthole-companion-${{ env.companion }}.vsix
            ```

            Run `/porthole` in an interactive session to check the install.

  # Separate from the release, deliberately. A Marketplace hiccup or a missing
  # PAT must not cost us the GitHub release and its asset - that asset is the
  # install path for anyone who does not want the Marketplace, and it is what
  # the release notes point at.
  #
  # DORMANT AS OF 0.7.0, and not by choice. Azure DevOps retired global PATs on
  # 15 March 2026, and "All accessible organizations" - which the VS Code docs
  # still instruct you to select - can no longer be created. Whether vsce
  # accepts an organization-scoped token is an open question:
  # https://github.com/microsoft/vscode/issues/322741
  #
  # So 0.4.0 was published by hand, by uploading the VSIX at
  # https://marketplace.visualstudio.com/manage/publishers/Lando-00, which needs
  # no token at all. This job stays here, and stays a no-op, until VSCE_PAT can
  # be set to something that works.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is a Marketplace token configured?
        id: token
        run: |
          if [ -n "${VSCE_PAT}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No VSCE_PAT secret, so the Marketplace publish was skipped. The release asset is still available."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Re-publishing a version the Marketplace already has is a hard error, and
      # a tag can legitimately be re-pushed. Check first so that is a no-op
      # rather than a red build.
      - name: Is this version already published?
        if: steps.token.outputs.present == 'true'
        id: published
        run: |
          COMPANION=$(node -p "require('./vscode-extension/package.json').version")
          echo "companion=$COMPANION" >> "$GITHUB_ENV"
          LIVE=$(npx --yes @vscode/vsce show Lando-00.porthole-companion --json 2>/dev/null \
                 | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch{''}" || true)
          echo "live version: '${LIVE}', building: '${COMPANION}'"
          if [ "$LIVE" = "$COMPANION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${COMPANION} is already on the Marketplace; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the VS Code Marketplace
        if: steps.token.outputs.present == 'true' && steps.published.outputs.skip == 'false'
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
